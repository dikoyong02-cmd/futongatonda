<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK Video Editor - Multi Theme & Windows</title>
    <style>
        :root {
            --win-bg: #c0c0c0;
            --win-dark: #808080;
            --win-light: #dfdfdf;
            --win-darker: #404040;
            --win-blue: #000080;
            --win-text: #000000;
            --panel-inner: #ececec;
            --desktop-bg: #008080;
        }

        /* 테마 1: 클래식 95 다크 */
        body[data-theme="win95-dark"] {
            --win-bg: #2b2b2b;
            --win-dark: #141414;
            --win-light: #424242;
            --win-darker: #000000;
            --win-blue: #1a0033;
            --win-text: #ffccff;
            --panel-inner: #1c1c1c;
            --desktop-bg: #0b0610;
        }

        /* 테마 2: Y2K 핑크 고딕 */
        body[data-theme="y2k-pink"] {
            --win-bg: #fff0f5;
            --win-dark: #ffb6c1;
            --win-light: #ffffff;
            --win-darker: #d81b60;
            --win-blue: #c2185b;
            --win-text: #4a1525;
            --panel-inner: #ffe4e1;
            --desktop-bg: #fce4ec;
        }

        /* 테마 3: 매트릭스 힙합 다크 */
        body[data-theme="matrix-green"] {
            --win-bg: #0d1117;
            --win-dark: #21262d;
            --win-light: #30363d;
            --win-darker: #000000;
            --win-blue: #238636;
            --win-text: #56d364;
            --panel-inner: #161b22;
            --desktop-bg: #010409;
        }

        /* 테마 4: 레트로 오렌지 (시네마틱) */
        body[data-theme="retro-orange"] {
            --win-bg: #2d231e;
            --win-dark: #1a1411;
            --win-light: #4a3b32;
            --win-darker: #0d0a08;
            --win-blue: #d97706;
            --win-text: #fde68a;
            --panel-inner: #1f1815;
            --desktop-bg: #1c1410;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 4px;
            font-family: 'MS Sans Serif', 'Microsoft Sans Serif', 'Courier New', monospace;
            background-color: var(--desktop-bg);
            color: var(--win-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* 상단 메뉴바 */
        .top-menu-bar {
            height: 35px;
            background-color: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-light) var(--win-darker) var(--win-darker) var(--win-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-size: 11px;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .menu-items {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button, select, input[type="file"] {
            background-color: var(--win-bg);
            color: var(--win-text);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            padding: 3px 6px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }
        button:active {
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
        }

        /* 창 크기 조절 가능한 작업 공간 그리드 */
        .main-workspace {
            display: grid;
            grid-template-columns: var(--col-1, 250px) 4px 1fr 4px var(--col-3, 260px);
            grid-template-rows: 1fr 4px var(--row-2, 140px);
            flex-grow: 1;
            gap: 0;
            overflow: hidden;
        }

        /* 리사이즈 핸들 */
        .resizer-col-1 { grid-column: 2; grid-row: 1 / span 3; cursor: ew-resize; background: var(--win-dark); }
        .resizer-col-3 { grid-column: 4; grid-row: 1 / span 3; cursor: ew-resize; background: var(--win-dark); }
        .resizer-row-2 { grid-column: 1 / span 5; grid-row: 2; cursor: ns-resize; background: var(--win-dark); }

        /* 윈도우 창 박스 스타일 */
        .window {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), var(--win-darker));
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .title-bar-controls button {
            background-color: var(--win-bg);
            color: black;
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-darker);
            border-bottom: 1px solid var(--win-darker);
            width: 14px;
            height: 12px;
            font-size: 8px;
            line-height: 6px;
            padding: 0;
            cursor: pointer;
        }

        .sunken-panel {
            background-color: var(--panel-inner);
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            padding: 6px;
            overflow: auto;
            flex-grow: 1;
        }

        /* 패널 배치 위치 */
        .panel-library { grid-column: 1; grid-row: 1; }
        .panel-preview { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; }
        .panel-inspector { grid-column: 5; grid-row: 1 / span 3; }
        .panel-timeline { grid-column: 1 / span 3; grid-row: 3; }

        #targetBox {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, var(--win-blue), var(--win-darker));
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            transition: transform 0.3s, opacity 0.3s;
        }

        .control-group {
            margin-bottom: 8px;
            font-size: 11px;
        }
        .control-group label {
            display: block;
            margin-bottom: 3px;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body data-theme="win95-dark" id="mainBody">

    <!-- 상단 메뉴바 -->
    <div class="top-menu-bar">
        <div class="menu-items">
            <span style="font-weight: bold; color: var(--win-blue);">IDK-EDITSITE</span>
            
            <!-- 테마 선택 드롭다운 -->
            <label style="font-size:11px;">테마:</label>
            <select id="themeSelector" onchange="changeTheme(this.value)">
                <option value="win95-dark">클래식 윈도우 다크</option>
                <option value="y2k-pink">Y2K 핑크 고딕</option>
                <option value="matrix-green">매트릭스 힙합</option>
                <option value="retro-orange">레트로 오렌지</option>
            </select>

            <button onclick="resetLayout()">창 크기/위치 초기화</button>
            <button onclick="saveProjectToDevice()">프로젝트 저장</button>
        </div>
        <div style="font-size: 10px;">Resizable Windows v2.0</div>
    </div>

    <!-- 메인 워크스페이스 (크기 조절 가능 구조) -->
    <div class="main-workspace" id="workspace">

        <!-- 1. 미디어 라이브러리 패널 -->
        <div class="window panel-library">
            <div class="title-bar">
                <span>Media Source</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel">
                <label style="font-weight: bold; font-size: 11px;">비디오 파일 업로드</label>
                <input type="file" id="videoFile" accept="video/*" style="width: 100%; margin-top: 6px;">
                <div id="status" style="font-size: 10px; margin-top: 6px;"></div>
            </div>
        </div>

        <div class="resizer-col-1" id="resizer1"></div>

        <!-- 2. 프리뷰 패널 -->
        <div class="window panel-preview">
            <div class="title-bar">
                <span>Preview Window</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div id="targetBox">PREVIEW</div>
                <div style="font-size: 10px; margin-top: 10px;">00:00 / 00:10 (Keyframe Track)</div>
            </div>
        </div>

        <div class="resizer-col-3" id="resizer2"></div>

        <!-- 3. 인스펙터 속성 조절 패널 -->
        <div class="window panel-inspector">
            <div class="title-bar">
                <span>Keyframe Properties</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel">
                <div class="control-group">
                    <label>X Position</label>
                    <input type="range" id="rangeX" min="-90" max="90" value="0" oninput="updateAnimation()">
                </div>
                <div class="control-group">
                    <label>Scale</label>
                    <input type="range" id="rangeScale" min="0.5" max="1.5" step="0.1" value="1" oninput="updateAnimation()">
                </div>
                <div class="control-group">
                    <label>Opacity</label>
                    <input type="range" id="rangeOpacity" min="0.2" max="1" step="0.1" value="1" oninput="updateAnimation()">
                </div>
                <button onclick="playAutoAnimation()" style="width: 100%; margin-top: 10px;">애니메이션 테스트</button>
            </div>
        </div>

        <div class="resizer-row-2" id="resizer3"></div>

        <!-- 4. 타임라인 패널 -->
        <div class="window panel-timeline">
            <div class="title-bar">
                <span>Timeline Track</span>
                <div class="title-bar-controls"><button>-</button><button>X</button></div>
            </div>
            <div class="sunken-panel" style="display: flex; align-items: center;">
                <div style="width: 100%; height: 26px; background-color: var(--win-blue); display: flex; align-items: center; padding-left: 8px; font-size: 10px; color: white; border: 1px solid white;">
                    Video Clip #1 (Track 1)
                </div>
            </div>
        </div>

    </div>

    <script>
        // 테마 변경 함수
        function changeTheme(themeName) {
            document.getElementById('mainBody').setAttribute('data-theme', themeName);
            localStorage.setItem('idk_theme', themeName);
        }

        // 저장된 테마 불러오기
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('idk_theme');
            if(savedTheme) {
                document.getElementById('mainBody').setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelector').value = savedTheme;
            }
        });

        // 창 크기 조절(드래그) 기능 구현
        const workspace = document.getElementById('workspace');
        const resizer1 = document.getElementById('resizer1');
        const resizer2 = document.getElementById('resizer2');
        const resizer3 = document.getElementById('resizer3');

        let isResizing = false;

        resizer1.addEventListener('mousedown', (e) => {
            isResizing = 'col1';
            e.preventDefault();
        });

        resizer2.addEventListener('mousedown', (e) => {
            isResizing = 'col3';
            e.preventDefault();
        });

        resizer3.addEventListener('mousedown', (e) => {
            isResizing = 'row2';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const rect = workspace.getBoundingClientRect();

            if (isResizing === 'col1') {
                let newWidth = e.clientX - rect.left;
                if (newWidth > 150 && newWidth < 500) {
                    workspace.style.setProperty('--col-1', newWidth + 'px');
                }
            } else if (isResizing === 'col3') {
                let newWidth = rect.right - e.clientX;
                if (newWidth > 180 && newWidth < 500) {
                    workspace.style.setProperty('--col-3', newWidth + 'px');
                }
            } else if (isResizing === 'row2') {
                let newHeight = rect.bottom - e.clientY;
                if (newHeight > 80 && newHeight < 300) {
                    workspace.style.setProperty('--row-2', newHeight + 'px');
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isResizing = null;
        });

        // 창 크기 및 위치 초기화 함수
        function resetLayout() {
            workspace.style.setProperty('--col-1', '250px');
            workspace.style.setProperty('--col-3', '260px');
            workspace.style.setProperty('--row-2', '140px');
        }

        // 파일 업로드 상태 처리
        const fileInput = document.getElementById('videoFile');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                status.innerText = `Loaded: ${fileInput.files[0].name}`;
            }
        });

        function updateAnimation() {
            const x = document.getElementById('rangeX').value;
            const scale = document.getElementById('rangeScale').value;
            const opacity = document.getElementById('rangeOpacity').value;
            const box = document.getElementById('targetBox');

            box.style.transform = `translateX(${x}px) scale(${scale})`;
            box.style.opacity = opacity;
        }

        function playAutoAnimation() {
            const box = document.getElementById('targetBox');
            box.style.transform = `translateX(50px) scale(1.3)`;
            box.style.opacity = 0.5;
            document.getElementById('rangeX').value = 50;
            document.getElementById('rangeScale').value = 1.3;
            document.getElementById('rangeOpacity').value = 0.5;

            setTimeout(() => {
                box.style.transform = `translateX(0px) scale(1)`;
                box.style.opacity = 1;
                document.getElementById('rangeX').value = 0;
                document.getElementById('rangeScale').value = 1;
                document.getElementById('rangeOpacity').value = 1;
            }, 800);
        }

        function saveProjectToDevice() {
            const projectData = {
                site: "IDK Editsite",
                theme: document.body.getAttribute("data-theme"),
                settings: {
                    x: document.getElementById('rangeX').value,
                    scale: document.getElementById('rangeScale').value,
                    opacity: document.getElementById('rangeOpacity').value
                },
                savedAt: new Date().toISOString()
            };

            const dataString = JSON.stringify(projectData, null, 2);
            const blob = new Blob([dataString], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'idk-project-save.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
